- name: Gate on active Pacific UTC offset
  id: gate
  env:
    EVENT_NAME: ${{ github.event_name }}
    SCHEDULE: ${{ github.event.schedule }}
  run: |
    if [ "$EVENT_NAME" != "schedule" ]; then
      echo "run=true" >> "$GITHUB_OUTPUT"
      echo "Manual run: ingestion enabled."
      exit 0
    fi

    offset="$(TZ=America/Los_Angeles date +%z)"

    echo "Los Angeles UTC offset: $offset"
    echo "Scheduled expression: $SCHEDULE"

    if { [ "$offset" = "-0700" ] && [ "$SCHEDULE" = "0 16 * * *" ]; } ||
       { [ "$offset" = "-0800" ] && [ "$SCHEDULE" = "0 17 * * *" ]; }; then
      echo "run=true" >> "$GITHUB_OUTPUT"
      echo "Correct 9 AM Pacific schedule: running ingestion."
    else
      echo "run=false" >> "$GITHUB_OUTPUT"
      echo "Inactive DST/PST schedule: skipping."
    fi
