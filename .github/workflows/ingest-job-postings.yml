name: Ingest job postings

on:
  schedule:
    # 9:00 AM PDT
    - cron: "0 16 * * *"

    # 9:00 AM PST
    - cron: "0 17 * * *"

  workflow_dispatch:

concurrency:
  group: ingest-job-postings
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gate on active Pacific UTC offset
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: ingestion enabled."
            exit 0
          fi

          offset="$(TZ=America/Los_Angeles date +%z)"

          echo "Los Angeles UTC offset: $offset"
          echo "Scheduled expression: $SCHEDULE"

          if { [ "$offset" = "-0700" ] && [ "$SCHEDULE" = "0 16 * * *" ]; } ||
             { [ "$offset" = "-0800" ] && [ "$SCHEDULE" = "0 17 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Correct 9 AM Pacific schedule: running ingestion."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive DST/PST schedule: skipping."
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m app.ingestion.runner
